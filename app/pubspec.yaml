name: petwalk
description: 반려견 산책 기록 및 산책로 추천 앱
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 위치 / GPS
  geolocator: ^13.0.1

  # 지도 (개발 단계: OSM 타일. 추후 네이버/카카오 SDK로 교체 예정)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # 로컬 저장
  sqflite: ^2.3.3
  path: ^1.9.0

  # 상태관리
  provider: ^6.1.2
  sqflite_common_ffi_web: ^1.1.2

  # 테마
  # 두 테마의 인상 차이가 대부분 글꼴에서 온다. 손글씨(Poor Story)와
  # 초굵은 고딕(Black Han Sans)을 빼면 두 안이 거의 같아 보인다.
  google_fonts: ^6.2.1
  # 테마 선택은 앱을 껐다 켜도 남아야 한다. 이것 하나 때문에 DB 스키마를
  # 올리는 건 과하다.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.2+1

flutter:
  uses-material-design: true
